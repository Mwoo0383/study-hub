spring:
  application:
    name: StudyHub

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

  sql:
    init:
      mode: never

springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html